# Kein Build, kein Paketmanager: Netlify veroeffentlicht das
# Wurzelverzeichnis so, wie es im Repository liegt.
# Die Kopfzeilen stehen in der Datei _headers.

[build]
  publish = "."

# Arbeitsdateien fuer Claude Code (Skills, Projektnotizen) nicht
# veroeffentlichen. Netlify liefert sonst jede Datei im Repo aus.
# force = true greift auch dann, wenn die Datei tatsaechlich existiert.
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
