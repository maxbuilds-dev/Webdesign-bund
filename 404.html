<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Content Security Policy: die Seite darf ausschliesslich Dateien von sich
       selbst laden. Sollte jemals fremder Code ins HTML gelangen, kann er weder
       ein Skript von aussen nachladen noch Daten irgendwohin senden.
       Die Seite hat bewusst keine externen Abhaengigkeiten, deshalb ist 'self'
       ueberall ausreichend. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Seite nicht gefunden: Webdesign Bund</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050D09">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <!-- Schriften lokal, keine Verbindung zu Google -->
  <link rel="preload" href="assets/fonts/stack-sans-headline-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/stack-sans-text-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <!-- Ohne JavaScript blieben die Einblend-Elemente unsichtbar.
       Diese Datei macht sie sofort sichtbar. -->
  <noscript><link rel="stylesheet" href="css/nojs.css"></noscript>
</head>
<body>
  <section class="page-404 theme-dark">
    <div class="container">
      <p class="seite-kennung">Fehler 404</p>
      <h1>Diese Seite existiert nicht.</h1>
      <p class="hero-sub">
        Der aufgerufene Link ist möglicherweise veraltet oder fehlerhaft.
      </p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Zur Startseite</a>
      </div>
    </div>
  </section>
  <script src="js/script.js"></script>
</body>
</html>
