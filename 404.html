<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden: Webdesign Bund</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0B0F">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='%235B7FFF'/></svg>">
  <!-- Schriften lokal, keine Verbindung zu Google -->
  <link rel="preload" href="fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">

<body>
  <section class="hero" style="min-height:100vh;display:grid;place-items:center;">
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="glow-orb" id="glowOrb" aria-hidden="true"></div>
    <div class="container">
      <span class="section-label" style="justify-content:center;">Fehler 404</span>
      <h1 style="animation:none;clip-path:none;">Diese Seite gibt es nicht.</h1>
      <p class="hero-sub" style="animation:none;opacity:1;">

        Zurück zur Startseite geht es hier.
      </p>
      <div class="hero-actions" style="animation:none;opacity:1;">
        <a class="btn btn-primary" href="/">Zur Startseite</a>
